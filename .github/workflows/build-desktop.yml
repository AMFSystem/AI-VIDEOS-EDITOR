name: Build Desktop App (Mac & Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Prepare Binaries
        run: npm run prepare:binaries

      - name: Build Desktop (Mac)
        run: npm run desktop:build:mac

      - name: Upload Mac DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Editor-Mac
          path: desktop/release/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg via Chocolatey
        run: choco install ffmpeg -y

      - name: Prepare Binaries
        run: npm run prepare:binaries

      - name: Build Desktop (Windows)
        run: npm run desktop:build:win

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Editor-Windows
          path: desktop/release/*.exe

